<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی ثبت‌نام - دانشگاه علوم پزشکی یاسوج</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, sans-serif; overflow: hidden; background-color: #000; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* استایل نقشه کوچک */
        #minimap-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            z-index: 1000;
            overflow: hidden;
            background: #333;
        }
        #minimap-image { width: 100%; height: auto; display: block; opacity: 0.9; }
        #marker {
            position: absolute;
            width: 12px; height: 12px;
            background-color: #ff0000;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.8s ease;
            top: 85%; left: 15%;
        }
        #hint {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 8px 15px; border-radius: 5px;
            z-index: 1000; font-size: 14px;
            pointer-events: none;
        }

        /* ✅ ناحیه کلیک غول‌پیکر ۳۰۰ در ۳۰۰ پیکسل (کاملاً نامرئی) */
        .giant-click-area {
            opacity: 0 !important;
            width: 300px !important;
            height: 300px !important;
            cursor: pointer;
            /* تنظیم مرکزیت: نصف عرض و ارتفاع */
            margin-left: -150px !important;
            margin-top: -150px !important;
        }
    </style>
</head>
<body>

<div id="hint">برای حرکت، روی فلش‌های داخل عکس کلیک کنید</div>
<div id="panorama"></div>

<!-- نقشه تعاملی -->
<div id="minimap-container">
    <img src="map.jpg" id="minimap-image" alt="نقشه">
    <div id="marker"></div>
</div>

<script>
    var viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene1",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": true
        },
        "scenes": {
            "scene1": {
                "title": "۱. بیرون ورودی پردیس",
                "type": "equirectangular",
                "panorama": "01_outside_entrance.jpg",
                "yaw": -70.3,
                "hotSpots": [{
                    "pitch": -0.9, "yaw": -70.3, 
                    "type": "scene", "text": "", 
                    "sceneId": "scene2",
                    "cssClass": "giant-click-area"
                }]
            },
            "scene2": {
                "title": "۲. داخل ورودی پردیس (انتخاب مسیر)",
                "type": "equirectangular",
                "panorama": "02_inside_entrance.jpg",
                "yaw": -60.0,
                "hotSpots": [
                    { "pitch": -9.7, "yaw": -60.0, "type": "scene", "text": "", "sceneId": "reg1", "cssClass": "giant-click-area" },
                    { "pitch": -3.2, "yaw": -151.7, "type": "scene", "text": "", "sceneId": "fac1", "cssClass": "giant-click-area" }
                ]
            },
            "reg1": {
                "title": "۳. مسیر ثبت‌نام ۱",
                "type": "equirectangular",
                "panorama": "03_reg_path_1.jpg",
                "yaw": 9.4,
                "hotSpots": [{ "pitch": -4.1, "yaw": 9.4, "type": "scene", "text": "", "sceneId": "reg2", "cssClass": "giant-click-area" }]
            },
            "reg2": {
                "title": "۴. مسیر ثبت‌نام ۲",
                "type": "equirectangular",
                "panorama": "04_reg_path_2.jpg",
                "yaw": -45.2,
                "hotSpots": [{ "pitch": -3.7, "yaw": -45.2, "type": "scene", "text": "", "sceneId": "reg3", "cssClass": "giant-click-area" }]
            },
            "reg3": {
                "title": "۵. مسیر ثبت‌نام ۳",
                "type": "equirectangular",
                "panorama": "05_reg_path_3.jpg",
                "yaw": -90.3,
                "hotSpots": [{ "pitch": 2.0, "yaw": -90.3, "type": "scene", "text": "", "sceneId": "reg4", "cssClass": "giant-click-area" }]
            },
            "reg4": {
                "title": "۶. مسیر ثبت‌نام ۴",
                "type": "equirectangular",
                "panorama": "06_reg_path_4.jpg",
                "yaw": -23.3,
                "hotSpots": [{ "pitch": -3.1, "yaw": -23.3, "type": "scene", "text": "", "sceneId": "reg5", "cssClass": "giant-click-area" }]
            },
            "reg5": {
                "title": "۷. مسیر ثبت‌نام ۵",
                "type": "equirectangular",
                "panorama": "07_reg_path_5.jpg",
                "yaw": -31.7,
                "hotSpots": [{ "pitch": -2.3, "yaw": -31.7, "type": "scene", "text": "", "sceneId": "reg6", "cssClass": "giant-click-area" }]
            },
            "reg6": {
                "title": "۸. مسیر ثبت‌نام ۶",
                "type": "equirectangular",
                "panorama": "08_reg_path_6.jpg",
                "yaw": -48.8,
                "hotSpots": [{ "pitch": -3.5, "yaw": -48.8, "type": "scene", "text": "", "sceneId": "reg_lib", "cssClass": "giant-click-area" }]
            },
            "reg_lib": {
                "title": "۹. سالن ساختمان کتابخانه",
                "type": "equirectangular",
                "panorama": "10_library_hall.jpg",
                "yaw": 47.1,
                "hotSpots": [{ "pitch": -0.4, "yaw": 47.1, "type": "scene", "text": "", "sceneId": "reg_room_path", "cssClass": "giant-click-area" }]
            },
            "reg_room_path": {
                "title": "۱۰. مسیر اتاق ثبت‌نام",
                "type": "equirectangular",
                "panorama": "11_reg_room_path_1.jpg",
                "yaw": 13.6,
                "hotSpots": [{ "pitch": -6.0, "yaw": 13.6, "type": "scene", "text": "", "sceneId": "reg_room", "cssClass": "giant-click-area" }]
            },
            "reg_room": {
                "title": "۱۱. اتاق ثبت‌نام (مقصد)",
                "type": "equirectangular",
                "panorama": "13_registration_room.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": 0, "yaw": 0, "type": "info", "text": "📍 به اتاق ثبت‌نام خوش آمدید." }]
            },
            "cafe1": {
                "title": "۱۲. مسیر سلف سرویس ۱",
                "type": "equirectangular",
                "panorama": "14_cafeteria_path_1.jpg",
                "yaw": -42.9,
                "hotSpots": [{ "pitch": 1.1, "yaw": -42.9, "type": "scene", "text": "", "sceneId": "cafe2", "cssClass": "giant-click-area" }]
            },
            "cafe2": {
                "title": "۱۳. مسیر سلف سرویس ۲",
                "type": "equirectangular",
                "panorama": "15_cafeteria_path_2.jpg",
                "yaw": -50.7,
                "hotSpots": [{ "pitch": -1.0, "yaw": -50.7, "type": "scene", "text": "", "sceneId": "cafe3", "cssClass": "giant-click-area" }]
            },
            "cafe3": {
                "title": "۱۴. مسیر سلف سرویس ۳",
                "type": "equirectangular",
                "panorama": "16_cafeteria_path_3.jpg",
                "yaw": 132.9,
                "hotSpots": [{ "pitch": -13.6, "yaw": 132.9, "type": "info", "text": "🍽️ شما به سلف سرویس رسیدید." }]
            },
            "fac1": {
                "title": "۱۵. مسیر دانشکده‌ها ۱",
                "type": "equirectangular",
                "panorama": "17_faculties_path_1.jpg",
                "yaw": 0.4,
                "hotSpots": [{ "pitch": -8.6, "yaw": 0.4, "type": "scene", "text": "", "sceneId": "fac2", "cssClass": "giant-click-area" }]
            },
            "fac2": {
                "title": "۱۶. مسیر دانشکده ۲",
                "type": "equirectangular",
                "panorama": "18_faculties_path_2.jpg",
                "yaw": -36.9,
                "hotSpots": [{ "pitch": -6.1, "yaw": -36.9, "type": "scene", "text": "", "sceneId": "fac3", "cssClass": "giant-click-area" }]
            },
            "fac3": {
                "title": "۱۷. داخل ساختمان دانشکده",
                "type": "equirectangular",
                "panorama": "20_inside_faculty.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": 0, "yaw": 0, "type": "info", "text": "🏫 شما داخل ساختمان دانشکده هستید." }]
            }
        }
    });

    const mapCoordinates = {
        'scene1': { top: '85%', left: '15%' },
        'scene2': { top: '80%', left: '20%' },
        'reg1': { top: '75%', left: '25%' },
        'reg2': { top: '70%', left: '30%' },
        'reg3': { top: '65%', left: '35%' },
        'reg4': { top: '60%', left: '40%' },
        'reg5': { top: '55%', left: '45%' },
        'reg6': { top: '50%', left: '50%' },
        'reg_lib': { top: '45%', left: '55%' },
        'reg_room_path': { top: '40%', left: '60%' },
        'reg_room': { top: '35%', left: '65%' },
        'cafe1': { top: '70%', left: '70%' },
        'cafe2': { top: '60%', left: '75%' },
        'cafe3': { top: '50%', left: '80%' },
        'fac1': { top: '60%', left: '20%' },
        'fac2': { top: '50%', left: '10%' },
        'fac3': { top: '40%', left: '5%' }
    };

    viewer.on('scenechange', function(sceneId) {
        const coords = mapCoordinates[sceneId];
        if (coords) {
            const marker = document.getElementById('marker');
            marker.style.top = coords.top;
            marker.style.left = coords.left;
        }
    });

    setTimeout(function() {
        var scenes = viewer.getConfig().scenes;
        for (var key in scenes) {
            if (scenes[key].panorama) {
                var img = new Image();
                img.src = scenes[key].panorama;
            }
        }
    }, 3000);
</script>

</body>
</html>
