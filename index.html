<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی ثبت‌نام - دانشگاه علوم پزشکی یاسوج</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, sans-serif; overflow: hidden; background-color: #000; }
        #panorama { width: 100vw; height: 100vh; }
        
        /* استایل نقشه کوچک */
        #minimap-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            z-index: 1000;
            overflow: hidden;
            background: #333;
        }
        #minimap-image {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.9;
        }
        #marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ff0000;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.8s ease;
            top: 90%; left: 10%;
        }
        #hint {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            z-index: 1000;
            font-size: 12px;
            pointer-events: none;
        }

        /* ✅ استایل سفارشی برای فلش‌های راهنما (بزرگ‌تر و خواناتر) */
        .pnlm-hotspot.pnlm-scene {
            background-color: rgba(0, 0, 0, 0.85) !important;
            border: 2px solid #ffd700 !important; /* حاشیه طلایی */
            border-radius: 8px !important;
            padding: 10px 15px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            color: #fff !important;
            text-shadow: 1px 1px 2px #000 !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
            width: auto !important;
            height: auto !important;
            white-space: nowrap !important;
        }
    </style>
</head>
<body>

<div id="hint">برای انتخاب مسیر، روی دکمه‌های راهنما کلیک کنید</div>

<div id="panorama"></div>

<!-- نقشه تعاملی -->
<div id="minimap-container">
    <img src="map.jpg" id="minimap-image" alt="نقشه">
    <div id="marker"></div>
</div>

<script>
    var viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene1",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": true
        },
        "scenes": {
            "scene1": {
                "title": "۱. بیرون ورودی پردیس",
                "type": "equirectangular",
                "panorama": "01_outside_entrance.jpg",
                "yaw": 0,
                "hotSpots": [{
                    "pitch": -5, "yaw": 50, 
                    "type": "scene", "text": "🚪 ورود به محوطه",
                    "sceneId": "scene2"
                }]
            },
            "scene2": {
                "title": "۲. داخل ورودی پردیس (انتخاب مسیر)",
                "type": "equirectangular",
                "panorama": "02_inside_entrance.jpg",
                "yaw": 0,
                "hotSpots": [
                    // ⚠️ این زاویه‌ها (yaw) فرضی هستند. با ابزار tune.html تنظیم کنید.
                    { "pitch": -5, "yaw": -68, "type": "scene", "text": "🔴 به سمت محل ثبت‌نام", "sceneId": "reg1" },
                    { "pitch": -5, "yaw": 68, "type": "scene", "text": "🟡 به سمت سلف سرویس", "sceneId": "cafe1" },
                    { "pitch": -5, "yaw": -152, "type": "scene", "text": "🟢 به سمت دانشکده‌ها", "sceneId": "fac1" }
                ]
            },
            "reg1": {
                "title": "۳. مسیر ثبت‌نام ۱",
                "type": "equirectangular",
                "panorama": "03_reg_path_1.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 70, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "reg2" }]
            },
            "reg2": {
                "title": "۴. مسیر ثبت‌نام ۲",
                "type": "equirectangular",
                "panorama": "04_reg_path_2.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 80, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "reg3" }]
            },
            "reg3": {
                "title": "۵. مسیر ثبت‌نام ۳",
                "type": "equirectangular",
                "panorama": "05_reg_path_3.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 90, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "reg4" }]
            },
            "reg4": {
                "title": "۶. مسیر ثبت‌نام ۴",
                "type": "equirectangular",
                "panorama": "06_reg_path_4.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 100, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "reg5" }]
            },
            "reg5": {
                "title": "۷. مسیر ثبت‌نام ۵",
                "type": "equirectangular",
                "panorama": "07_reg_path_5.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 110, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "reg6" }]
            },
            "reg6": {
                "title": "۸. مسیر ثبت‌نام ۶",
                "type": "equirectangular",
                "panorama": "08_reg_path_6.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 120, "type": "scene", "text": "🏛️ رسیدن به کتابخانه", "sceneId": "reg_lib" }]
            },
            "reg_lib": {
                "title": "۹. سالن ساختمان کتابخانه",
                "type": "equirectangular",
                "panorama": "10_library_hall.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 130, "type": "scene", "text": "➡️ مسیر اتاق ثبت‌نام", "sceneId": "reg_room_path" }]
            },
            "reg_room_path": {
                "title": "۱۰. مسیر اتاق ثبت‌نام",
                "type": "equirectangular",
                "panorama": "11_reg_room_path_1.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 140, "type": "scene", "text": "🚪 ورود به اتاق", "sceneId": "reg_room" }]
            },
            "reg_room": {
                "title": "۱۱. اتاق ثبت‌نام (مقصد)",
                "type": "equirectangular",
                "panorama": "13_registration_room.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": 0, "yaw": 0, "type": "info", "text": "📍 به اتاق ثبت‌نام خوش آمدید. مدارک خود را آماده کنید." }]
            },
            "cafe1": {
                "title": "۱۲. مسیر سلف سرویس ۱",
                "type": "equirectangular",
                "panorama": "14_cafeteria_path_1.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 50, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "cafe2" }]
            },
            "cafe2": {
                "title": "۱۳. مسیر سلف سرویس ۲",
                "type": "equirectangular",
                "panorama": "15_cafeteria_path_2.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 60, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "cafe3" }]
            },
            "cafe3": {
                "title": "۱۴. مسیر سلف سرویس ۳",
                "type": "equirectangular",
                "panorama": "16_cafeteria_path_3.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": 0, "yaw": 0, "type": "info", "text": "🍽️ شما به سلف سرویس رسیدید." }]
            },
            "fac1": {
                "title": "۱۵. مسیر دانشکده‌ها ۱",
                "type": "equirectangular",
                "panorama": "17_faculties_path_1.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 70, "type": "scene", "text": "⬆️ ادامه مسیر", "sceneId": "fac2" }]
            },
            "fac2": {
                "title": "۱۶. مسیر دانشکده ۲",
                "type": "equirectangular",
                "panorama": "18_faculties_path_2.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": -5, "yaw": 80, "type": "scene", "text": "🚪 ورود به ساختمان", "sceneId": "fac3" }]
            },
            "fac3": {
                "title": "۱۷. داخل ساختمان دانشکده",
                "type": "equirectangular",
                "panorama": "20_inside_faculty.jpg",
                "yaw": 0,
                "hotSpots": [{ "pitch": 0, "yaw": 0, "type": "info", "text": "🏫 شما داخل ساختمان دانشکده هستید." }]
            }
        }
    });

    const mapCoordinates = {
        'scene1': { top: '85%', left: '15%' },
        'scene2': { top: '80%', left: '20%' },
        'reg1': { top: '75%', left: '25%' },
        'reg2': { top: '70%', left: '30%' },
        'reg3': { top: '65%', left: '35%' },
        'reg4': { top: '60%', left: '40%' },
        'reg5': { top: '55%', left: '45%' },
        'reg6': { top: '50%', left: '50%' },
        'reg_lib': { top: '45%', left: '55%' },
        'reg_room_path': { top: '40%', left: '60%' },
        'reg_room': { top: '35%', left: '65%' },
        'cafe1': { top: '70%', left: '70%' },
        'cafe2': { top: '60%', left: '75%' },
        'cafe3': { top: '50%', left: '80%' },
        'fac1': { top: '60%', left: '20%' },
        'fac2': { top: '50%', left: '10%' },
        'fac3': { top: '40%', left: '5%' }
    };

    viewer.on('scenechange', function(sceneId) {
        const coords = mapCoordinates[sceneId];
        if (coords) {
            const marker = document.getElementById('marker');
            marker.style.top = coords.top;
            marker.style.left = coords.left;
        }
    });

    // ✅ پیش‌بارگذاری عکس‌ها (برای روان شدن حرکت)
    setTimeout(function() {
        var scenes = viewer.getConfig().scenes;
        for (var key in scenes) {
            if (scenes[key].panorama) {
                var img = new Image();
                img.src = scenes[key].panorama;
            }
        }
    }, 3000);
</script>

</body>
</html>
