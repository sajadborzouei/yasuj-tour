<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی ثبت‌نام - دانشگاه علوم پزشکی یاسوج</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, sans-serif; overflow: hidden; background-color: #000; }
        #panorama { width: 100vw; height: 100vh; }
        
        #minimap-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 250px;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 1000;
            overflow: hidden;
            background: #333;
        }
        #minimap-image { width: 100%; height: auto; display: block; opacity: 0.9; }
        #marker {
            position: absolute;
            width: 15px; height: 15px;
            background-color: #ff0000;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.8s ease;
            top: 85%; left: 15%;
        }
        #hint {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 8px 15px; border-radius: 5px;
            z-index: 1000; font-size: 14px;
            pointer-events: none;
        }

        /* دکمه قرمز (ادامه) - دقیقاً روی yaw */
        .forward-hotspot {
            background-color: rgba(255, 0, 0, 0.8) !important;
            border: 3px solid #fff !important;
            border-radius: 50% !important;
            width: 80px !important;
            height: 80px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 40px !important;
            color: #fff !important;
            box-shadow: 0 0 20px rgba(255,0,0,0.9) !important;
            cursor: pointer !important;
            transform: translate(-50%, -50%) !important;
            transition: transform 0.2s !important;
        }
        .forward-hotspot:hover {
            transform: translate(-50%, -50%) scale(1.1) !important;
            background-color: rgba(255, 0, 0, 1) !important;
        }

        /* دکمه آبی (بازگشت) - کمی پایین‌تر از دکمه قرمز قرار می‌گیرد */
        .backward-hotspot {
            background-color: rgba(0, 102, 255, 0.8) !important;
            border: 3px solid #fff !important;
            border-radius: 50% !important;
            width: 60px !important;
            height: 60px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 30px !important;
            color: #fff !important;
            box-shadow: 0 0 15px rgba(0,102,255,0.9) !important;
            cursor: pointer !important;
            transform: translate(-50%, -50%) !important;
            transition: transform 0.2s !important;
            margin-top: 60px; /* فاصله از دکمه قرمز */
        }
        .backward-hotspot:hover {
            transform: translate(-50%, -50%) scale(1.1) !important;
            background-color: rgba(0, 102, 255, 1) !important;
        }
    </style>
</head>
<body>

<div id="hint">🔴 ادامه مسیر | 🔵 بازگشت</div>
<div id="panorama"></div>

<div id="minimap-container">
    <img src="map.jpg" id="minimap-image" alt="نقشه">
    <div id="marker"></div>
</div>

<script>
    var viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene1",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": true,
            "minHfov": 40,
            "maxHfov": 120
        },
        "scenes": {
            "scene1": {
                "title": "۱. بیرون ورودی پردیس",
                "type": "equirectangular",
                "panorama": "01_outside_entrance.jpg",
                "yaw": -70.3,
                "hotSpots": [{
                    "pitch": -0.9, "yaw": -70.3, 
                    "type": "scene", "text": "➡️", 
                    "sceneId": "scene2",
                    "cssClass": "forward-hotspot"
                }]
            },
            "scene2": {
                "title": "۲. داخل ورودی پردیس",
                "type": "equirectangular",
                "panorama": "02_inside_entrance.jpg",
                "yaw": -60.0,
                "hotSpots": [
                    { "pitch": -9.7, "yaw": -60.0, "type": "scene", "text": "🔴", "sceneId": "reg1", "cssClass": "forward-hotspot" },
                    { "pitch": -3.2, "yaw": -151.7, "type": "scene", "text": "🟢", "sceneId": "fac1", "cssClass": "forward-hotspot" },
                    // دکمه بازگشت به بیرون (همان yaw دکمه ادامه)
                    { "pitch": -5.0, "yaw": -60.0, "type": "scene", "text": "⬅️", "sceneId": "scene1", "cssClass": "backward-hotspot" }
                ]
            },
            "reg1": {
                "title": "۳. مسیر ثبت‌نام ۱",
                "type": "equirectangular",
                "panorama": "03_reg_path_1.jpg",
                "yaw": 9.4,
                "hotSpots": [
                    { "pitch": -4.1, "yaw": 9.4, "type": "scene", "text": "⬆️", "sceneId": "reg2", "cssClass": "forward-hotspot" },
                    { "pitch": -4.0, "yaw": 9.4, "type": "scene", "text": "⬅️", "sceneId": "scene2", "cssClass": "backward-hotspot" }
                ]
            },
            "reg2": {
                "title": "۴. مسیر ثبت‌نام ۲",
                "type": "equirectangular",
                "panorama": "04_reg_path_2.jpg",
                "yaw": -45.2,
                "hotSpots": [
                    { "pitch": -3.7, "yaw": -45.2, "type": "scene", "text": "⬆️", "sceneId": "reg3", "cssClass": "forward-hotspot" },
                    { "pitch": -3.7, "yaw": -45.2, "type": "scene", "text": "⬅️", "sceneId": "reg1", "cssClass": "backward-hotspot" }
                ]
            },
            "reg3": {
                "title": "۵. مسیر ثبت‌نام ۳",
                "type": "equirectangular",
                "panorama": "05_reg_path_3.jpg",
                "yaw": -90.3,
                "hotSpots": [
                    { "pitch": 2.0, "yaw": -90.3, "type": "scene", "text": "⬆️", "sceneId": "reg4", "cssClass": "forward-hotspot" },
                    { "pitch": 2.0, "yaw": -90.3, "type": "scene", "text": "⬅️", "sceneId": "reg2", "cssClass": "backward-hotspot" }
                ]
            },
            "reg4": {
                "title": "۶. مسیر ثبت‌نام ۴",
                "type": "equirectangular",
                "panorama": "06_reg_path_4.jpg",
                "yaw": -23.3,
                "hotSpots": [
                    { "pitch": -3.1, "yaw": -23.3, "type": "scene", "text": "⬆️", "sceneId": "reg5", "cssClass": "forward-hotspot" },
                    { "pitch": -3.1, "yaw": -23.3, "type": "scene", "text": "⬅️", "sceneId": "reg3", "cssClass": "backward-hotspot" }
                ]
            },
            "reg5": {
                "title": "۷. مسیر ثبت‌نام ۵",
                "type": "equirectangular",
                "panorama": "07_reg_path_5.jpg",
                "yaw": -31.7,
                "hotSpots": [
                    { "pitch": -2.3, "yaw": -31.7, "type": "scene", "text": "⬆️", "sceneId": "reg6", "cssClass": "forward-hotspot" },
                    { "pitch": -2.3, "yaw": -31.7, "type": "scene", "text": "⬅️", "sceneId": "reg4", "cssClass": "backward-hotspot" }
                ]
            },
            "reg6": {
                "title": "۸. مسیر ثبت‌نام ۶",
                "type": "equirectangular",
                "panorama": "08_reg_path_6.jpg",
                "yaw": -48.8,
                "hotSpots": [
                    { "pitch": -3.5, "yaw": -48.8, "type": "scene", "text": "🏛️", "sceneId": "reg_lib", "cssClass": "forward-hotspot" },
                    { "pitch": -3.5, "yaw": -48.8, "type": "scene", "text": "⬅️", "sceneId": "reg5", "cssClass": "backward-hotspot" }
                ]
            },
            "reg_lib": {
                "title": "۹. سالن ساختمان کتابخانه",
                "type": "equirectangular",
                "panorama": "10_library_hall.jpg",
                "yaw": 47.1,
                "hotSpots": [
                    { "pitch": -0.4, "yaw": 47.1, "type": "scene", "text": "➡️", "sceneId": "reg_room_path", "cssClass": "forward-hotspot" },
                    { "pitch": -0.4, "yaw": 47.1, "type": "scene", "text": "⬅️", "sceneId": "reg6", "cssClass": "backward-hotspot" }
                ]
            },
            "reg_room_path": {
                "title": "۱۰. مسیر اتاق ثبت‌نام",
                "type": "equirectangular",
                "panorama": "11_reg_room_path_1.jpg",
                "yaw": 13.6,
                "hotSpots": [
                    { "pitch": -6.0, "yaw": 13.6, "type": "scene", "text": "🚪", "sceneId": "reg_room", "cssClass": "forward-hotspot" },
                    { "pitch": -6.0, "yaw": 13.6, "type": "scene", "text": "⬅️", "sceneId": "reg_lib", "cssClass": "backward-hotspot" }
                ]
            },
            "reg_room": {
                "title": "۱۱. اتاق ثبت‌نام (مقصد)",
                "type": "equirectangular",
                "panorama": "13_registration_room.jpg",
                "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": 0, "type": "info", "text": "📍 به اتاق ثبت‌نام خوش آمدید." },
                    { "pitch": 0, "yaw": 0, "type": "scene", "text": "⬅️ بازگشت", "sceneId": "reg_room_path", "cssClass": "backward-hotspot" }
                ]
            },
            "cafe1": {
                "title": "۱۲. مسیر سلف سرویس ۱",
                "type": "equirectangular",
                "panorama": "14_cafeteria_path_1.jpg",
                "yaw": -42.9,
                "hotSpots": [
                    { "pitch": 1.1, "yaw": -42.9, "type": "scene", "text": "⬆️", "sceneId": "cafe2", "cssClass": "forward-hotspot" },
                    { "pitch": 1.1, "yaw": -42.9, "type": "scene", "text": "⬅️", "sceneId": "scene2", "cssClass": "backward-hotspot" }
                ]
            },
            "cafe2": {
                "title": "۱۳. مسیر سلف سرویس ۲",
                "type": "equirectangular",
                "panorama": "15_cafeteria_path_2.jpg",
                "yaw": -50.7,
                "hotSpots": [
                    { "pitch": -1.0, "yaw": -50.7, "type": "scene", "text": "⬆️", "sceneId": "cafe3", "cssClass": "forward-hotspot" },
                    { "pitch": -1.0, "yaw": -50.7, "type": "scene", "text": "⬅️", "sceneId": "cafe1", "cssClass": "backward-hotspot" }
                ]
            },
            "cafe3": {
                "title": "۱۴. مسیر سلف سرویس ۳",
                "type": "equirectangular",
                "panorama": "16_cafeteria_path_3.jpg",
                "yaw": 132.9,
                "hotSpots": [
                    { "pitch": -13.6, "yaw": 132.9, "type": "info", "text": "🍽️ سلف سرویس" },
                    { "pitch": -13.6, "yaw": 132.9, "type": "scene", "text": "⬅️ بازگشت", "sceneId": "cafe2", "cssClass": "backward-hotspot" }
                ]
            },
            "fac1": {
                "title": "۱۵. مسیر دانشکده‌ها ۱",
                "type": "equirectangular",
                "panorama": "17_faculties_path_1.jpg",
                "yaw": 0.4,
                "hotSpots": [
                    { "pitch": -8.6, "yaw": 0.4, "type": "scene", "text": "⬆️", "sceneId": "fac2", "cssClass": "forward-hotspot" },
                    { "pitch": -8.6, "yaw": 0.4, "type": "scene", "text": "⬅️", "sceneId": "scene2", "cssClass": "backward-hotspot" }
                ]
            },
            "fac2": {
                "title": "۱۶. مسیر دانشکده ۲",
                "type": "equirectangular",
                "panorama": "18_faculties_path_2.jpg",
                "yaw": -36.9,
                "hotSpots": [
                    { "pitch": -6.1, "yaw": -36.9, "type": "scene", "text": "🚪", "sceneId": "fac3", "cssClass": "forward-hotspot" },
                    { "pitch": -6.1, "yaw": -36.9, "type": "scene", "text": "⬅️", "sceneId": "fac1", "cssClass": "backward-hotspot" }
                ]
            },
            "fac3": {
                "title": "۱۷. داخل ساختمان دانشکده",
                "type": "equirectangular",
                "panorama": "20_inside_faculty.jpg",
                "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": 0, "type": "info", "text": "🏫 دانشکده" },
                    { "pitch": 0, "yaw": 0, "type": "scene", "text": "⬅️ بازگشت", "sceneId": "fac2", "cssClass": "backward-hotspot" }
                ]
            }
        }
    });

    // قابلیت زوم (اختیاری) - با کلیک و زوم کار می‌کند
    let lastHfov = 100;
    const ZOOM_IN_THRESHOLD = 70;
    const ZOOM_OUT_THRESHOLD = 110;
    let isTransitioning = false;

    viewer.on('zoom', function() {
        if (isTransitioning) return;
        
        const hfov = viewer.getHfov();
        const currentYaw = viewer.getYaw();
        const currentScene = viewer.getScene();
        const scenes = viewer.getConfig().scenes;
        
        if (hfov < ZOOM_IN_THRESHOLD && lastHfov >= ZOOM_IN_THRESHOLD) {
            if (scenes[currentScene] && scenes[currentScene].hotSpots) {
                const targetHotspot = scenes[currentScene].hotSpots.find(hs => {
                    if (hs.type !== 'scene' || hs.cssClass !== 'forward-hotspot') return false;
                    const yawDiff = Math.abs(hs.yaw - currentYaw);
                    return Math.min(yawDiff, 360 - yawDiff) < 30;
                });
                if (targetHotspot) {
                    isTransitioning = true;
                    viewer.loadScene(targetHotspot.sceneId);
                    setTimeout(() => { isTransitioning = false; }, 1000);
                }
            }
        }
        else if (hfov > ZOOM_OUT_THRESHOLD && lastHfov <= ZOOM_OUT_THRESHOLD) {
            if (scenes[currentScene] && scenes[currentScene].hotSpots) {
                const targetHotspot = scenes[currentScene].hotSpots.find(hs => {
                    if (hs.type !== 'scene' || hs.cssClass !== 'backward-hotspot') return false;
                    const yawDiff = Math.abs(hs.yaw - currentYaw);
                    return Math.min(yawDiff, 360 - yawDiff) < 30;
                });
                if (targetHotspot) {
                    isTransitioning = true;
                    viewer.loadScene(targetHotspot.sceneId);
                    setTimeout(() => { isTransitioning = false; }, 1000);
                }
            }
        }
        
        lastHfov = hfov;
    });

    const mapCoordinates = {
        'scene1': { top: '85%', left: '15%' },
        'scene2': { top: '80%', left: '20%' },
        'reg1': { top: '75%', left: '25%' },
        'reg2': { top: '70%', left: '30%' },
        'reg3': { top: '65%', left: '35%' },
        'reg4': { top: '60%', left: '40%' },
        'reg5': { top: '55%', left: '45%' },
        'reg6': { top: '50%', left: '50%' },
        'reg_lib': { top: '45%', left: '55%' },
        'reg_room_path': { top: '40%', left: '60%' },
        'reg_room': { top: '35%', left: '65%' },
        'cafe1': { top: '70%', left: '70%' },
        'cafe2': { top: '60%', left: '75%' },
        'cafe3': { top: '50%', left: '80%' },
        'fac1': { top: '60%', left: '20%' },
        'fac2': { top: '50%', left: '10%' },
        'fac3': { top: '40%', left: '5%' }
    };

    viewer.on('scenechange', function(sceneId) {
        const coords = mapCoordinates[sceneId];
        if (coords) {
            const marker = document.getElementById('marker');
            marker.style.top = coords.top;
            marker.style.left = coords.left;
        }
    });

    setTimeout(function() {
        var scenes = viewer.getConfig().scenes;
        for (var key in scenes) {
            if (scenes[key].panorama) {
                var img = new Image();
                img.src = scenes[key].panorama;
            }
        }
    }, 3000);
</script>

</body>
</html>
