<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی ثبت‌نام - دانشگاه علوم پزشکی یاسوج</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, sans-serif; overflow: hidden; background-color: #000; }
        #panorama { width: 100vw; height: 100vh; }
        
        #minimap-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 350px;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
            z-index: 1000;
            overflow: hidden;
            background: #333;
        }
        #minimap-image { width: 100%; height: auto; display: block; opacity: 0.9; }
        
        #marker {
            position: absolute;
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 25px solid #ff0000;
            transform: translate(-50%, -50%) rotate(0deg);
            transition: all 0.5s ease;
            top: 62.4%; left: 31.6%;
            filter: drop-shadow(0 0 5px rgba(255,0,0,0.8));
            z-index: 1001;
        }
        #marker::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -2px;
            width: 4px;
            height: 10px;
            background: #fff;
            border-radius: 2px;
        }
        
        #hint {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 8px 15px; border-radius: 5px;
            z-index: 1000; font-size: 14px;
            pointer-events: none;
        }

        #nav-buttons {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .nav-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .nav-btn.forward {
            background-color: rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(255,0,0,0.9);
        }
        .nav-btn.forward:hover {
            background-color: rgba(255, 0, 0, 1);
            transform: scale(1.1);
        }

        .nav-btn.backward {
            background-color: rgba(0, 102, 255, 0.8);
            box-shadow: 0 0 20px rgba(0,102,255,0.9);
        }
        .nav-btn.backward:hover {
            background-color: rgba(0, 102, 255, 1);
            transform: scale(1.1);
        }

        /* ✅ دکمه‌های ثابت */
        #fixed-buttons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 2000;
        }

        .fixed-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .fixed-btn.reg {
            background-color: rgba(255, 0, 0, 0.9);
            box-shadow: 0 0 20px rgba(255,0,0,0.9);
        }
        .fixed-btn.reg:hover {
            background-color: rgba(255, 0, 0, 1);
            transform: scale(1.1);
        }

        .fixed-btn.cafe {
            background-color: rgba(0, 200, 0, 0.9);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.9);
        }
        .fixed-btn.cafe:hover {
            background-color: rgba(0, 255, 0, 1);
            transform: scale(1.1);
        }

        .fixed-btn.exit {
            background-color: rgba(0, 102, 255, 0.9);
            box-shadow: 0 0 20px rgba(0,102,255,0.9);
        }
        .fixed-btn.exit:hover {
            background-color: rgba(0, 102, 255, 1);
            transform: scale(1.1);
        }

        .invisible-hotspot {
            opacity: 0 !important;
            width: 300px !important;
            height: 300px !important;
            cursor: pointer;
            transform: translate(-50%, -50%) !important;
        }
    </style>
</head>
<body>

<div id="hint">🔴 ثبت‌نام | 🟢 سلف سرویس | 🔵 خروج</div>

<div id="nav-buttons">
    <button class="nav-btn forward" id="btn-forward" title="ادامه مسیر">➡️</button>
    <button class="nav-btn backward" id="btn-backward" title="بازگشت">⬅️</button>
</div>

<!-- ✅ دکمه‌های ثابت -->
<div id="fixed-buttons">
    <button class="fixed-btn reg" id="btn-reg" title="ثبت‌نام">🔴</button>
    <button class="fixed-btn cafe" id="btn-cafe" title="سلف سرویس">🟢</button>
    <button class="fixed-btn exit" id="btn-exit" title="خروج">🔵</button>
</div>

<div id="panorama"></div>

<div id="minimap-container">
    <img src="map.jpg" id="minimap-image" alt="نقشه">
    <div id="marker"></div>
</div>

<script>
    var viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene1",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showControls": true,
            "hfov": 100,
            "minHfov": 30,
            "maxHfov": 120
        },
        "scenes": {
            "scene1": {
                "title": "۱. بیرون ورودی پردیس",
                "type": "equirectangular",
                "panorama": "01_outside_entrance.jpg",
                "yaw": -70.3,
                "hotSpots": [
                    { "pitch": -0.9, "yaw": -70.3, "type": "scene", "text": "", "sceneId": "scene2", "cssClass": "invisible-hotspot" }
                ]
            },
            "scene2": {
                "title": "۲. داخل ورودی پردیس",
                "type": "equirectangular",
                "panorama": "02_inside_entrance.jpg",
                "yaw": -60.0,
                "hotSpots": [
                    { "pitch": -9.7, "yaw": -60.0, "type": "scene", "text": "", "sceneId": "fork", "cssClass": "invisible-hotspot" }
                ]
            },
            "fork": {
                "title": "۳. دوشاخه (انتخاب مسیر)",
                "type": "equirectangular",
                "panorama": "03_reg_path_1.jpg",
                "yaw": 9.4,
                "hotSpots": [
                    { "pitch": -4.1, "yaw": 9.4, "type": "scene", "text": "", "sceneId": "reg1", "cssClass": "invisible-hotspot" },
                    { "pitch": -4.1, "yaw": 9.4, "type": "scene", "text": "", "sceneId": "cafe1", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg1": {
                "title": "۴. مسیر ثبت‌نام ۱",
                "type": "equirectangular",
                "panorama": "03_reg_path_1.jpg",
                "yaw": 9.4,
                "hotSpots": [
                    { "pitch": -4.1, "yaw": 9.4, "type": "scene", "text": "", "sceneId": "reg2", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg2": {
                "title": "۵. مسیر ثبت‌نام ۲",
                "type": "equirectangular",
                "panorama": "04_reg_path_2.jpg",
                "yaw": -45.2,
                "hotSpots": [
                    { "pitch": -3.7, "yaw": -45.2, "type": "scene", "text": "", "sceneId": "reg3", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg3": {
                "title": "۶. مسیر ثبت‌نام ۳",
                "type": "equirectangular",
                "panorama": "05_reg_path_3.jpg",
                "yaw": -90.3,
                "hotSpots": [
                    { "pitch": 2.0, "yaw": -90.3, "type": "scene", "text": "", "sceneId": "reg4", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg4": {
                "title": "۷. مسیر ثبت‌نام ۴",
                "type": "equirectangular",
                "panorama": "06_reg_path_4.jpg",
                "yaw": -23.3,
                "hotSpots": [
                    { "pitch": -3.1, "yaw": -23.3, "type": "scene", "text": "", "sceneId": "reg5", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg5": {
                "title": "۸. مسیر ثبت‌نام ۵",
                "type": "equirectangular",
                "panorama": "07_reg_path_5.jpg",
                "yaw": -31.7,
                "hotSpots": [
                    { "pitch": -2.3, "yaw": -31.7, "type": "scene", "text": "", "sceneId": "reg6", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg6": {
                "title": "۹. مسیر ثبت‌نام ۶",
                "type": "equirectangular",
                "panorama": "08_reg_path_6.jpg",
                "yaw": -48.8,
                "hotSpots": [
                    { "pitch": -3.5, "yaw": -48.8, "type": "scene", "text": "", "sceneId": "reg_lib", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg_lib": {
                "title": "۱۰. سالن ساختمان کتابخانه",
                "type": "equirectangular",
                "panorama": "10_library_hall.jpg",
                "yaw": 47.1,
                "hotSpots": [
                    { "pitch": -0.4, "yaw": 47.1, "type": "scene", "text": "", "sceneId": "reg_room_path", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg_room_path": {
                "title": "۱۱. مسیر اتاق ثبت‌نام",
                "type": "equirectangular",
                "panorama": "11_reg_room_path_1.jpg",
                "yaw": 13.6,
                "hotSpots": [
                    { "pitch": -6.0, "yaw": 13.6, "type": "scene", "text": "", "sceneId": "reg_room", "cssClass": "invisible-hotspot" }
                ]
            },
            "reg_room": {
                "title": "۱۲. اتاق ثبت‌نام (مقصد)",
                "type": "equirectangular",
                "panorama": "13_registration_room.jpg",
                "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": 0, "type": "info", "text": "📍 به اتاق ثبت‌نام خوش آمدید." }
                ]
            },
            "cafe1": {
                "title": "۱۳. مسیر سلف سرویس ۱",
                "type": "equirectangular",
                "panorama": "14_cafeteria_path_1.jpg",
                "yaw": -42.9,
                "hotSpots": [
                    { "pitch": 1.1, "yaw": -42.9, "type": "scene", "text": "", "sceneId": "cafe2", "cssClass": "invisible-hotspot" }
                ]
            },
            "cafe2": {
                "title": "۱۴. مسیر سلف سرویس ۲",
                "type": "equirectangular",
                "panorama": "15_cafeteria_path_2.jpg",
                "yaw": -50.7,
                "hotSpots": [
                    { "pitch": -1.0, "yaw": -50.7, "type": "scene", "text": "", "sceneId": "cafe3", "cssClass": "invisible-hotspot" }
                ]
            },
            "cafe3": {
                "title": "۱۵. مسیر سلف سرویس ۳",
                "type": "equirectangular",
                "panorama": "16_cafeteria_path_3.jpg",
                "yaw": 132.9,
                "hotSpots": [
                    { "pitch": -13.6, "yaw": 132.9, "type": "info", "text": "🍽️ سلف سرویس" }
                ]
            }
        }
    });

    // ✅ تاریخچه و انتقال
    let historyStack = [];
    let isTransitioning = false;
    const returnYawMap = {};

    historyStack.push({ sceneId: 'scene1', yaw: viewer.getYaw(), pitch: viewer.getPitch() });

    // ✅ تابع انیمیشن
    function goToScene(targetSceneId, targetYaw, targetPitch) {
        if (isTransitioning) return;
        isTransitioning = true;

        const currentYaw = viewer.getYaw();
        let yawDiff = targetYaw - currentYaw;
        while (yawDiff > 180) yawDiff -= 360;
        while (yawDiff < -180) yawDiff += 360;
        
        const absDiff = Math.abs(yawDiff);
        const duration = Math.min(2000, Math.max(1000, absDiff * 10));
        
        viewer.setYaw(targetYaw, duration);
        
        setTimeout(() => {
            const currentHfov = viewer.getHfov();
            const newHfov = Math.max(30, currentHfov / 3);
            viewer.setHfov(newHfov, 800);
            
            setTimeout(() => {
                viewer.loadScene(targetSceneId);
                setTimeout(() => {
                    viewer.setHfov(100, 500);
                    isTransitioning = false;
                }, 500);
            }, 900);
        }, duration + 100);
    }

    // ✅ دکمه ادامه
    document.getElementById('btn-forward').addEventListener('click', function() {
        const currentScene = viewer.getScene();
        const scenes = viewer.getConfig().scenes;
        if (scenes[currentScene] && scenes[currentScene].hotSpots) {
            const forwardHotspot = scenes[currentScene].hotSpots.find(hs => hs.type === 'scene');
            if (forwardHotspot) {
                returnYawMap[forwardHotspot.sceneId] = viewer.getYaw();
                historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                goToScene(forwardHotspot.sceneId, forwardHotspot.yaw, forwardHotspot.pitch);
            }
        }
    });

    // ✅ دکمه بازگشت
    document.getElementById('btn-backward').addEventListener('click', function() {
        if (historyStack.length > 1) {
            historyStack.pop();
            const prevEntry = historyStack[historyStack.length - 1];
            const backYaw = returnYawMap[prevEntry.sceneId] !== undefined 
                ? returnYawMap[prevEntry.sceneId] 
                : prevEntry.yaw;
            goToScene(prevEntry.sceneId, backYaw, prevEntry.pitch);
        }
    });

    // ✅ دکمه ثبت‌نام (با منطق هوشمند)
    document.getElementById('btn-reg').addEventListener('click', function() {
        const currentScene = viewer.getScene();
        
        // اگر در مسیر ثبت‌نام هستیم، کاری نکن
        if (currentScene.startsWith('reg') || currentScene === 'reg_room') return;
        
        if (currentScene === 'scene1') {
            // از عکس اول به دوم برو
            historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
            goToScene('scene2', -60.0, -9.7);
            setTimeout(() => {
                historyStack.push({ sceneId: 'scene2', yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                goToScene('fork', 9.4, -4.1);
                setTimeout(() => {
                    historyStack.push({ sceneId: 'fork', yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                    goToScene('reg1', 9.4, -4.1);
                }, 2500);
            }, 2500);
            return;
        }
        
        if (currentScene === 'scene2') {
            // از ورودی به دوشاخه و بعد ثبت‌نام
            historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
            goToScene('fork', 9.4, -4.1);
            setTimeout(() => {
                historyStack.push({ sceneId: 'fork', yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                goToScene('reg1', 9.4, -4.1);
            }, 2500);
            return;
        }
        
        if (currentScene === 'fork' || currentScene.startsWith('cafe')) {
            // از دوشاخه یا سلف به ثبت‌نام
            historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
            goToScene('reg1', 9.4, -4.1);
            return;
        }
    });

    // ✅ دکمه سلف سرویس (با منطق هوشمند)
    document.getElementById('btn-cafe').addEventListener('click', function() {
        const currentScene = viewer.getScene();
        
        // اگر در مسیر سلف هستیم، کاری نکن
        if (currentScene.startsWith('cafe')) return;
        
        if (currentScene === 'scene1') {
            // از عکس اول به دوم برو
            historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
            goToScene('scene2', -60.0, -9.7);
            setTimeout(() => {
                historyStack.push({ sceneId: 'scene2', yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                goToScene('fork', 9.4, -4.1);
                setTimeout(() => {
                    historyStack.push({ sceneId: 'fork', yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                    goToScene('cafe1', -42.9, 1.1);
                }, 2500);
            }, 2500);
            return;
        }
        
        if (currentScene === 'scene2') {
            // از ورودی به دوشاخه و بعد سلف
            historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
            goToScene('fork', 9.4, -4.1);
            setTimeout(() => {
                historyStack.push({ sceneId: 'fork', yaw: viewer.getYaw(), pitch: viewer.getPitch() });
                goToScene('cafe1', -42.9, 1.1);
            }, 2500);
            return;
        }
        
        if (currentScene === 'fork' || currentScene.startsWith('reg')) {
            // از دوشاخه یا ثبت‌نام به سلف
            historyStack.push({ sceneId: currentScene, yaw: viewer.getYaw(), pitch: viewer.getPitch() });
            goToScene('cafe1', -42.9, 1.1);
            return;
        }
    });

    // ✅ دکمه خروج (مرحله به مرحله)
    document.getElementById('btn-exit').addEventListener('click', function() {
        if (historyStack.length > 1) {
            historyStack.pop();
            const prevEntry = historyStack[historyStack.length - 1];
            const backYaw = returnYawMap[prevEntry.sceneId] !== undefined 
                ? returnYawMap[prevEntry.sceneId] 
                : prevEntry.yaw;
            goToScene(prevEntry.sceneId, backYaw, prevEntry.pitch);
        }
    });

    const mapCoordinates = {
        'scene1': { top: '62.4%', left: '31.6%' },
        'scene2': { top: '55.6%', left: '35.1%' },
        'fork': { top: '63.8%', left: '42.9%' },
        'reg1': { top: '63.8%', left: '42.9%' },
        'reg2': { top: '72.4%', left: '51.9%' },
        'reg3': { top: '71.2%', left: '64.5%' },
        'reg4': { top: '65.8%', left: '67.4%' },
        'reg5': { top: '48.2%', left: '64.9%' },
        'reg6': { top: '44.9%', left: '79.7%' },
        'reg_lib': { top: '43.9%', left: '82.2%' },
        'reg_room_path': { top: '48.8%', left: '83.6%' },
        'reg_room': { top: '53.6%', left: '84.2%' },
        'cafe1': { top: '24.7%', left: '55.9%' },
        'cafe2': { top: '13.4%', left: '67.8%' },
        'cafe3': { top: '2.9%', left: '77.1%' }
    };

    let lastTop = null;
    let lastLeft = null;

    viewer.on('scenechange', function(sceneId) {
        const coords = mapCoordinates[sceneId];
        if (coords) {
            const marker = document.getElementById('marker');
            
            if (lastTop !== null && lastLeft !== null) {
                const topNum = parseFloat(coords.top);
                const leftNum = parseFloat(coords.left);
                const lastTopNum = parseFloat(lastTop);
                const lastLeftNum = parseFloat(lastLeft);
                
                const dx = leftNum - lastLeftNum;
                const dy = topNum - lastTopNum;
                const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                
                marker.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            }
            
            marker.style.top = coords.top;
            marker.style.left = coords.left;
            
            lastTop = coords.top;
            lastLeft = coords.left;
        }
    });

    setTimeout(() => {
        const marker = document.getElementById('marker');
        marker.style.top = '62.4%';
        marker.style.left = '31.6%';
        marker.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }, 100);

    setTimeout(function() {
        var scenes = viewer.getConfig().scenes;
        for (var key in scenes) {
            if (scenes[key].panorama) {
                var img = new Image();
                img.src = scenes[key].panorama;
            }
        }
    }, 3000);
</script>

</body>
</html>
